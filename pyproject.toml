[project]
name = "emd-v5-2-hybrid"
version = "0.1.0"
description = "ElectroMacroDiff V5.2 Hybrid low-resource molecular discovery pipeline"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
